services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: memora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memora}
      POSTGRES_USER: ${POSTGRES_USER:-memora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      MEMORA_APP_PASSWORD: ${MEMORA_APP_PASSWORD:-change_me_app_locally}
    ports: ["5432:5432"]
    volumes:
      - memora_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memora} -d ${POSTGRES_DB:-memora}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: memora-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [memora_redis:/data]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  memora_postgres:
  memora_redis:
